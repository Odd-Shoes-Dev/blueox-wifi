<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Router Stats — Blue OX WiFi Admin</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo.png" alt="Blue OX" style="height:36px;object-fit:contain" />
      <div><div class="logo-text">BLUE OX</div><div class="logo-sub">WIFI ADMIN</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a href="/admin/" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/admin/videos" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>Videos</a>
      <a href="/admin/vouchers" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M16 7v10M8 7v10"/></svg>Vouchers</a>
      <div class="nav-label">Router</div>
      <a href="/admin/router" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M2 12h4M18 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>Router Stats</a>
      <a href="/admin/users" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Connected Users</a>
      <div class="nav-label">Settings</div>
      <a href="/admin/settings" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" id="logoutBtn">Sign Out</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title">ROUTER STATS</div>
        <div class="page-sub" id="lastUpdated">Auto-refreshes every 15 seconds</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh Now</button>
    </div>
    <div class="content">

      <div id="errorAlert" class="alert alert-error mb-6" style="display:none"></div>

      <!-- Main stats -->
      <div class="stats-grid mb-6" id="statsGrid">
        <div class="stat-card"><div class="stat-label">CPU Load</div><div class="stat-value" id="statCpu">—</div></div>
        <div class="stat-card"><div class="stat-label">Connected Users</div><div class="stat-value green" id="statUsers">—</div></div>
        <div class="stat-card"><div class="stat-label">Free Memory</div><div class="stat-value primary" id="statMem">—</div></div>
        <div class="stat-card"><div class="stat-label">Uptime</div><div class="stat-value" id="statUptime">—</div></div>
      </div>

      <div class="grid-2" style="gap:20px">
        <!-- Memory detail -->
        <div class="card">
          <div class="card-title">Memory Usage</div>
          <div id="memDetail">
            <div class="text-muted text-sm">Loading...</div>
          </div>
        </div>

        <!-- Board info -->
        <div class="card">
          <div class="card-title">Device Info</div>
          <div id="boardInfo">
            <div class="text-muted text-sm">Loading...</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script>
    let refreshTimer = null;

    function renderStats(d) {
      document.getElementById("errorAlert").style.display = "none";

      document.getElementById("statCpu").textContent = d.cpuLoad + "%";
      document.getElementById("statUsers").textContent = d.connectedUsers;
      document.getElementById("statMem").textContent = d.freeMemoryMb + " MB free";
      document.getElementById("statUptime").textContent = d.uptime;

      const memPct = Math.round((d.usedMemoryMb / d.totalMemoryMb) * 100);
      const memColor = memPct > 80 ? "var(--color-accent)" : "var(--color-primary)";
      document.getElementById("memDetail").innerHTML = `
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span class="text-sm">${d.usedMemoryMb} MB used</span>
            <span class="text-sm text-muted">${d.totalMemoryMb} MB total</span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar-fill" style="width:${memPct}%;background:${memColor}"></div>
          </div>
          <div class="text-xs text-muted" style="margin-top:6px">${memPct}% used</div>
        </div>
        <div style="display:flex;justify-content:space-between">
          <div><div class="stat-label">Free Disk</div><div class="td-primary">${formatBytes(d.freeDiskBytes ?? 0)}</div></div>
          <div><div class="stat-label">Total Disk</div><div class="td-primary">${formatBytes(d.totalDiskBytes ?? 0)}</div></div>
        </div>`;

      document.getElementById("boardInfo").innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--color-border);padding-bottom:10px">
            <span class="text-sm text-muted">Board</span>
            <span class="td-primary text-sm">${d.boardName || "—"}</span>
          </div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--color-border);padding-bottom:10px">
            <span class="text-sm text-muted">RouterOS Version</span>
            <span class="td-mono text-sm">${d.version || "—"}</span>
          </div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--color-border);padding-bottom:10px">
            <span class="text-sm text-muted">Architecture</span>
            <span class="td-mono text-sm">${d.architecture || "—"}</span>
          </div>
          <div style="display:flex;justify-content:space-between">
            <span class="text-sm text-muted">CPU Count</span>
            <span class="td-primary text-sm">${d.cpuCount || "—"}</span>
          </div>
        </div>`;

      document.getElementById("lastUpdated").textContent = "Last updated: " + new Date().toLocaleTimeString();
    }

    async function loadStats() {
      const json = await routerApi("/stats");
      if (!json.success) {
        const el = document.getElementById("errorAlert");
        el.textContent = "Cannot reach router: " + (json.error || "Connection failed. Check settings.");
        el.style.display = "block";
        document.getElementById("memDetail").innerHTML = `<div class="text-muted text-sm">Unavailable</div>`;
        document.getElementById("boardInfo").innerHTML = `<div class="text-muted text-sm">Unavailable</div>`;
        return;
      }
      renderStats(json.data);
    }

    document.getElementById("refreshBtn").addEventListener("click", () => {
      clearInterval(refreshTimer);
      loadStats();
      refreshTimer = setInterval(loadStats, 15000);
    });

    requireAuth().then(() => {
      setActiveNav();
      setupLogout();
      loadStats();
      refreshTimer = setInterval(loadStats, 15000);
    });
  </script>
</body>
</html>
