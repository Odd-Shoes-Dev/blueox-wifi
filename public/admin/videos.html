<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos — Blue OX WiFi Admin</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo.png" alt="Blue OX" style="height:36px;object-fit:contain" />
      <div><div class="logo-text">BLUE OX</div><div class="logo-sub">WIFI ADMIN</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a href="/admin/" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/admin/videos" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>Videos</a>
      <a href="/admin/vouchers" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M16 7v10M8 7v10"/></svg>Vouchers</a>
      <div class="nav-label">Router</div>
      <a href="/admin/router" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M2 12h4M18 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>Router Stats</a>
      <a href="/admin/users" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Connected Users</a>
      <div class="nav-label">Settings</div>
      <a href="/admin/settings" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" id="logoutBtn">Sign Out</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title">VIDEOS</div>
        <div class="page-sub">Manage the YouTube videos shown on the portal</div>
      </div>
      <button class="btn btn-primary" id="showFormBtn">+ Add Video</button>
    </div>
    <div class="content">

      <!-- Add form -->
      <div class="card mb-6" id="addForm" style="display:none">
        <div class="card-title">Add New Video</div>
        <div class="grid-2">
          <div class="form-group">
            <label>Video Title</label>
            <input type="text" id="newTitle" placeholder="e.g. Blue OX Kampus Ad" />
          </div>
          <div class="form-group">
            <label>YouTube URL</label>
            <input type="url" id="newUrl" placeholder="https://www.youtube.com/watch?v=..." />
          </div>
          <div class="form-group">
            <label>Watch Duration (seconds before voucher appears)</label>
            <input type="number" id="newSeconds" value="30" min="5" max="300" />
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:4px">
          <button class="btn btn-primary" id="saveVideoBtn">Save Video</button>
          <button class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
        </div>
      </div>

      <!-- Video list -->
      <div class="card">
        <div id="videoList"><div class="loading-state" style="padding:40px;text-align:center;color:var(--color-text-muted)">Loading...</div></div>
      </div>

    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script>
    let videos = [];

    function toEmbedUrl(url) {
      try {
        const u = new URL(url);
        let id = null;
        if (u.hostname.includes("youtube.com")) {
          if (u.pathname.includes("/shorts/")) id = u.pathname.split("/shorts/")[1].split("?")[0];
          else id = u.searchParams.get("v");
        } else if (u.hostname === "youtu.be") {
          id = u.pathname.slice(1).split("?")[0];
        }
        return id ? `https://www.youtube.com/embed/${id}` : null;
      } catch { return null; }
    }

    function renderVideos() {
      const el = document.getElementById("videoList");
      if (!videos.length) {
        el.innerHTML = `<div class="empty-state">No videos yet. Add your first YouTube video above.</div>`;
        return;
      }
      el.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th style="width:200px">Preview</th>
              <th>Title</th>
              <th>Watch Time</th>
              <th>Status</th>
              <th></th>
            </tr></thead>
            <tbody>
              ${videos.map(v => {
                const embed = toEmbedUrl(v.youtube_url);
                return `<tr>
                  <td>
                    ${embed
                      ? `<div style="width:180px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000">
                           <iframe src="${embed}" width="180" style="height:100%;border:none;pointer-events:none" loading="lazy"></iframe>
                         </div>`
                      : `<div style="width:180px;height:101px;background:var(--color-bg-input);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--color-text-faint);font-size:12px">Invalid URL</div>`
                    }
                  </td>
                  <td>
                    <div class="td-primary">${v.title}</div>
                    <div class="td-mono text-xs text-muted" style="margin-top:4px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.youtube_url}</div>
                  </td>
                  <td class="td-mono">${v.watch_seconds}s</td>
                  <td><span class="badge ${v.is_active ? 'badge-green' : 'badge-red'}">${v.is_active ? 'Active' : 'Inactive'}</span></td>
                  <td>
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                      <button class="btn btn-ghost btn-sm" onclick="toggleVideo(${v.id}, ${v.is_active})">
                        ${v.is_active ? 'Disable' : 'Enable'}
                      </button>
                      <button class="btn btn-danger btn-sm" onclick="deleteVideo(${v.id}, '${v.title.replace(/'/g, "\\'")}')">Delete</button>
                    </div>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>`;
    }

    async function loadVideos() {
      const json = await api("/videos");
      if (json.success) { videos = json.data; renderVideos(); }
    }

    async function toggleVideo(id, current) {
      await api(`/videos/${id}`, {
        method: "PUT",
        body: JSON.stringify({ ...videos.find(v => v.id === id), is_active: current ? 0 : 1 }),
      });
      showToast(current ? "Video disabled" : "Video enabled");
      loadVideos();
    }

    async function deleteVideo(id, title) {
      if (!confirm(`Delete "${title}"?`)) return;
      await api(`/videos/${id}`, { method: "DELETE" });
      showToast("Video deleted");
      loadVideos();
    }

    document.getElementById("showFormBtn").addEventListener("click", () => {
      document.getElementById("addForm").style.display = "block";
      document.getElementById("newTitle").focus();
    });

    document.getElementById("cancelFormBtn").addEventListener("click", () => {
      document.getElementById("addForm").style.display = "none";
    });

    document.getElementById("saveVideoBtn").addEventListener("click", async () => {
      const title = document.getElementById("newTitle").value.trim();
      const url = document.getElementById("newUrl").value.trim();
      const seconds = document.getElementById("newSeconds").value;
      if (!title || !url) { showToast("Title and URL are required", "error"); return; }
      const json = await api("/videos", {
        method: "POST",
        body: JSON.stringify({ title, youtube_url: url, watch_seconds: parseInt(seconds) }),
      });
      if (json.success) {
        showToast("Video added");
        document.getElementById("addForm").style.display = "none";
        document.getElementById("newTitle").value = "";
        document.getElementById("newUrl").value = "";
        document.getElementById("newSeconds").value = "30";
        loadVideos();
      } else {
        showToast(json.error || "Failed to add video", "error");
      }
    });

    requireAuth().then(() => { setActiveNav(); setupLogout(); loadVideos(); });
  </script>
</body>
</html>
