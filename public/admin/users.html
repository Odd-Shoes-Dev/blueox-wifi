<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connected Users — Blue OX WiFi Admin</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo.png" alt="Blue OX" style="height:36px;object-fit:contain" />
      <div><div class="logo-text">BLUE OX</div><div class="logo-sub">WIFI ADMIN</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a href="/admin/" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/admin/videos" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>Videos</a>
      <a href="/admin/vouchers" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M16 7v10M8 7v10"/></svg>Vouchers</a>
      <div class="nav-label">Router</div>
      <a href="/admin/router" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M2 12h4M18 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>Router Stats</a>
      <a href="/admin/users" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Connected Users</a>
      <div class="nav-label">Settings</div>
      <a href="/admin/settings" class="nav-item"><svg class="nav-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" id="logoutBtn">Sign Out</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title">CONNECTED USERS</div>
        <div class="page-sub" id="lastUpdated">Auto-refreshes every 15 seconds</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="badge badge-green" id="liveCount" style="font-size:13px;padding:6px 12px">0 online</span>
        <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div class="content">

      <div id="errorAlert" class="alert alert-error mb-6" style="display:none"></div>

      <div class="card">
        <div id="usersTable"><div class="empty-state">Loading...</div></div>
      </div>

    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script>
    let refreshTimer = null;

    async function loadUsers() {
      const json = await routerApi("/users");

      if (!json.success) {
        document.getElementById("errorAlert").textContent =
          "Cannot reach router: " + (json.error || "Connection failed. Check settings.");
        document.getElementById("errorAlert").style.display = "block";
        document.getElementById("usersTable").innerHTML = `<div class="empty-state">Router unreachable</div>`;
        document.getElementById("liveCount").textContent = "offline";
        document.getElementById("liveCount").className = "badge badge-red";
        return;
      }

      document.getElementById("errorAlert").style.display = "none";
      const users = json.data;
      document.getElementById("liveCount").textContent = users.length + " online";
      document.getElementById("liveCount").className = "badge badge-green";
      document.getElementById("lastUpdated").textContent = "Last updated: " + new Date().toLocaleTimeString();

      const el = document.getElementById("usersTable");
      if (!users.length) {
        el.innerHTML = `<div class="empty-state">No users currently connected.</div>`;
        return;
      }

      el.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Username / Voucher</th>
              <th>IP Address</th>
              <th>MAC Address</th>
              <th>Session Time</th>
              <th>Data Up</th>
              <th>Data Down</th>
              <th></th>
            </tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td class="td-primary td-mono">${u.name || u.user || "—"}</td>
                  <td class="td-mono text-sm">${u.address || "—"}</td>
                  <td class="td-mono text-xs">${u["mac-address"] || "—"}</td>
                  <td class="text-sm">${u.uptime || "—"}</td>
                  <td class="text-sm">${formatBytes(u["bytes-out"] || 0)}</td>
                  <td class="text-sm">${formatBytes(u["bytes-in"] || 0)}</td>
                  <td>
                    <button class="btn btn-danger btn-sm" onclick="kickUser('${u[".id"]}', '${(u.name || u.user || "").replace(/'/g, "\\'")}')">
                      Kick
                    </button>
                  </td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    async function kickUser(id, name) {
      if (!confirm(`Disconnect "${name}" from the network?`)) return;
      const json = await routerApi("/users/" + encodeURIComponent(id), { method: "DELETE" });
      if (json.success) {
        showToast(`${name} disconnected`);
        loadUsers();
      } else {
        showToast(json.error || "Failed to kick user", "error");
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => {
      clearInterval(refreshTimer);
      loadUsers();
      refreshTimer = setInterval(loadUsers, 15000);
    });

    requireAuth().then(() => {
      setActiveNav();
      setupLogout();
      loadUsers();
      refreshTimer = setInterval(loadUsers, 15000);
    });
  </script>
</body>
</html>
